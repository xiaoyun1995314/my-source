name: 生成软件源

on:
  push:
    branches: [main]
    paths:
      - 'ipas/**'
      - 'gen_appstore.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成 appstore.json
        run: python3 gen_appstore.py

      - name: 提交生成结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appstore.json icons/
          git diff --staged --quiet || git commit -m "chore: 自动更新软件源"
          git push
