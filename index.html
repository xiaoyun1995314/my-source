<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訫云软件源</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{color:#e8eaed;font-family:-apple-system,"PingFang SC",sans-serif;display:flex;justify-content:center;padding:24px 16px;min-height:100vh;position:relative}
  /* 固定背景层：滚动时图片不动 */
  .bg{position:fixed;top:0;left:0;width:100%;height:100%;background-image:url("bg.webp");background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed;z-index:0}
  body::before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.11);backdrop-filter:blur(2px);z-index:0}
  .card{max-width:480px;width:100%;background:rgba(26,29,36,.27);border-radius:18px;padding:28px 22px;box-shadow:0 8px 30px rgba(0,0,0,.3);align-self:flex-start;position:relative;z-index:1}
  h1{font-size:22px;margin:0 0 6px;text-align:center;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  p.sub{color:#e8eaed;font-size:14px;line-height:1.7;text-align:center;margin:8px 0 20px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;cursor:pointer;margin-top:12px;text-align:center;text-decoration:none;color:#fff}
  .btn-esign{background:#4d7cfe}
  .btn-qnq{background:#34a06a}
  .btn-copy{background:#2a2e38;color:#e8eaed}
  .btn-submit{background:#8b5cf6;color:#fff}
  .url{word-break:break-all;background:#11141a;border-radius:10px;padding:12px;font-size:13px;color:#8ab4f8;margin-top:18px}
  .tip{color:#e8eaed;font-size:12px;margin-top:14px;line-height:1.7;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#333;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:2}
  .toast.show{opacity:1}
  .bgm-fab{position:fixed;top:16px;right:16px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(26,29,36,.85);color:#fff;font-size:18px;cursor:pointer;z-index:4;box-shadow:0 2px 10px rgba(0,0,0,.4)}
  .bgm-name{position:fixed;top:64px;right:16px;font-size:11px;color:#e8eaed;z-index:3;max-width:150px;text-align:right;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .bgm-panel{position:fixed;top:66px;right:16px;width:220px;max-height:260px;overflow-y:auto;background:rgba(26,29,36,.95);border-radius:14px;padding:10px;z-index:4;display:none;box-shadow:0 4px 18px rgba(0,0,0,.5)}
  .bgm-panel.open{display:block}
  .bgm-panel h3{font-size:13px;color:#e8eaed;margin:4px 6px 8px}
  .bgm-item{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:10px;font-size:13px;color:#e8eaed;cursor:pointer;margin-top:4px}
  .bgm-item:active{background:rgba(255,255,255,.1)}
  .bgm-item.cur{background:#4d7cfe;color:#fff}
  .bgm-item .st{font-size:11px;opacity:.7}
</style>
</head>
<body>
<div class="bg"></div>
<button class="bgm-fab" id="bgmBtn" onclick="togglePanel()">🎶</button>
<div class="bgm-name" id="bgmName"></div>
<div class="bgm-panel" id="bgmPanel">
  <h3>播放列表</h3>
  <div id="bgmList"></div>
</div>
<audio id="bgm" preload="auto"></audio>
<div class="card">
  <h1>訫云软件源</h1>
  <p class="sub">点击下方按钮，一键把源添加到签名工具</p>

  <a class="btn btn-qnq" id="btnQnq" href="#">📲 一键添加到全能签</a>
  <a class="btn btn-esign" id="btnEsign" href="#">📲 一键添加到轻松签</a>
  <button class="btn btn-copy" onclick="copySrc()">📋 复制源地址（手动添加）</button>
  <a class="btn btn-submit" href="submit.html">📮 应用投稿</a>
  <a class="btn" href="apps.html" style="background:#0ea5e9">📂 浏览资源分类</a>

  <div class="url" id="src">https://xiaoyun1995314.github.io/my-source/appstore.json</div>
  <p class="tip">
    若一键添加未成功：复制上方地址，打开签名工具 → 软件源 / 源 → 点「+」粘贴即可。<br><br>
    仅供个人技术学习，请勿用于分发与商用。
  </p>
</div>
<div class="toast" id="toast"></div>

<script>
const SOURCE_URL = document.getElementById('src').textContent.trim();
const enc = encodeURIComponent(SOURCE_URL);

// 背景音乐播放列表：在这里加更多音频文件，循环播放
const tracks = ['bgm1.mp3', 'bgm2.mp3'];
const bgm = document.getElementById('bgm');
const bgmBtn = document.getElementById('bgmBtn');
const bgmName = document.getElementById('bgmName');
let ti = 0, playing = false;
const panel = document.getElementById('bgmPanel');

function loadTrack(){
  bgm.src = tracks[ti];
  bgmName.textContent = '♪ ' + tracks[ti];
  renderList();
}
function renderList(){
  document.getElementById('bgmList').innerHTML = tracks.map((t,i)=>
    `<div class="bgm-item ${i===ti?'cur':''}" onclick="playTrack(${i})"><span>${t}</span><span class="st">${i===ti?(playing?'▶':'⏸'):'▶'}</span></div>`
  ).join('');
}
function playTrack(i){
  if(i===ti && playing){ bgm.pause(); playing=false; renderList(); return; }
  ti = i; loadTrack();
  bgm.muted = false;
  bgm.play().then(()=>{ playing=true; renderList(); })
    .catch(()=>toast('浏览器拦截了播放，再点一次'));
}
function togglePanel(){ panel.classList.toggle('open'); renderList(); }
bgm.addEventListener('ended', ()=>{
  ti = (ti+1) % tracks.length;
  loadTrack();
  if(playing) bgm.play().catch(()=>{});
});

// 进入自动播放列表：先静音尝试自动播放，首次点屏幕时取消静音
loadTrack();
bgm.muted = true;
bgm.play().then(()=>{ playing = true; }).catch(()=>{});

document.addEventListener('touchstart', function once(){
  if(!bgm.src) loadTrack();
  bgm.muted = false;
  bgm.play().then(()=>{ playing = true; })
    .catch(()=>{});
  document.removeEventListener('touchstart', once);
}, {once:true});

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

// 直接用原生 <a> 顶层跳转（iOS Safari 最可靠的唤起方式）
// 页面被切走（document.hidden）说明已成功唤起；否则 2.5 秒后自动复制地址
const btnEsign = document.getElementById('btnEsign');
const btnQnq = document.getElementById('btnQnq');

btnEsign.href = 'esign://addsource?url=' + enc;
btnQnq.href = 'nsk-sign://addsource?url=' + enc;

function armFallback(failMsg){
  const start = Date.now();
  const timer = setTimeout(()=>{
    if (!document.hidden) {
      copySrc();
      toast(failMsg);
    }
  }, 2500);
  document.addEventListener('visibilitychange', ()=>{
    if (document.hidden) clearTimeout(timer);
  }, {once:true});
}

btnEsign.addEventListener('click', ()=>{
  armFallback('已复制，请在轻松签软件源中粘贴添加');
});

btnQnq.addEventListener('click', ()=>{
  armFallback('已复制，请在全能签软件源中粘贴添加');
});

function copySrc(){
  navigator.clipboard.writeText(SOURCE_URL).then(()=>toast('源地址已复制'));
}
</script>
</body>
</html>
