<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訫云软件源</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0f1115;color:#e8eaed;font-family:-apple-system,"PingFang SC",sans-serif;display:flex;justify-content:center;padding:24px 16px;min-height:100vh}
  .card{max-width:480px;width:100%;background:#1a1d24;border-radius:18px;padding:28px 22px;box-shadow:0 8px 30px rgba(0,0,0,.4);align-self:flex-start}
  h1{font-size:22px;margin:0 0 6px;text-align:center}
  p.sub{color:#9aa0a6;font-size:14px;line-height:1.7;text-align:center;margin:8px 0 20px}
  .btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;cursor:pointer;margin-top:12px;text-align:center;text-decoration:none;color:#fff}
  .btn-esign{background:#4d7cfe}
  .btn-qnq{background:#34a06a}
  .btn-copy{background:#2a2e38;color:#e8eaed}
  .url{word-break:break-all;background:#11141a;border-radius:10px;padding:12px;font-size:13px;color:#8ab4f8;margin-top:18px}
  .tip{color:#9aa0a6;font-size:12px;margin-top:14px;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#333;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="card">
  <h1>訫云软件源</h1>
  <p class="sub">点击下方按钮，一键把源添加到签名工具</p>

  <a class="btn btn-esign" id="btnEsign" href="#">📲 一键添加到轻松签（eSign）</a>
  <a class="btn btn-qnq" id="btnQnq" href="#">📲 一键添加到全能签</a>
  <button class="btn btn-copy" onclick="copySrc()">📋 复制源地址（手动添加）</button>

  <div class="url" id="src">https://xiaoyun1995314.github.io/my-source/appstore.json</div>
  <p class="tip">
    若一键添加未成功：复制上方地址，打开签名工具 → 软件源 / 源 → 点「+」粘贴即可。<br><br>
    仅供个人技术学习，请勿用于分发与商用。
  </p>
</div>
<div class="toast" id="toast"></div>

<script>
const SOURCE_URL = document.getElementById('src').textContent.trim();
const enc = encodeURIComponent(SOURCE_URL);

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

// 轻松签 eSign：已确认的跳转协议
document.getElementById('btnEsign').href = 'esign://addsource?url=' + enc;

// 全能签：尝试跳转，未成功则自动复制地址手动添加
document.getElementById('btnQnq').addEventListener('click', function(e){
  e.preventDefault();
  const start = Date.now();
  window.location.href = 'qnq://addsource?url=' + enc;
  setTimeout(()=>{
    if (Date.now() - start < 2200 && !document.hidden) {
      copySrc();
      toast('已复制，请在全能签软件源中粘贴添加');
    }
  }, 1800);
});

function copySrc(){
  navigator.clipboard.writeText(SOURCE_URL).then(()=>toast('源地址已复制'));
}
</script>
</body>
</html>
